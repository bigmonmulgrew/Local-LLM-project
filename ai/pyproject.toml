[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "friendly-ai-placeholder"
version = "0.1.0"
description = "Lifecycle-aware placeholder for future Python AI software"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
friendly-ai = "friendly_ai.main:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.build-backend]
module-name = "friendly_ai"
