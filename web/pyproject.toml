[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[project]
name = "L3M-Web"
version = "0.1.0"
description = "Local AI web application"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2,<1",
    "cryptography>=50.0.0",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.build-backend]
module-name = "L3M_Web"
