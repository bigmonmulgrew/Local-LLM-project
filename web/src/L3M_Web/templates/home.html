{% extends "base.html" %}

{% block content %}
<h1>Hello, world!</h1>
    <p>Your friendly Python, MySQL, and Ollama MVP is up and running.</p>

    <div class="grid">
        <div class="card">
            Web API
            <span class="ok">Ready</span>
        </div>
    
        <div class="card">
            MySQL
            <span class="{{ mysql.css_class }}">{{ mysql.label }}</span>
        </div>

        <div class="card">
            Ollama
            <span class="{{ ollama.css_class }}">{{ ollama.label }}</span>
        </div>
    </div>

    <p>Configured model: <code>{{ ollama_model }}</code> · Try the <a href="/docs">API docs</a>.</p>
{% endblock %}
